app-id: org.gnome.gThumb
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk

# Upstream flatpak manifest
# https://gitlab.gnome.org/GNOME/gthumb/-/blob/master/data/flatpak/org.gnome.gthumb.yml

command: gthumb
rename-icon: org.gnome.gthumb
copy-icon: true
rename-desktop-file: org.gnome.gthumb.desktop
rename-appdata-file: org.gnome.gthumb.metainfo.xml


finish-args:
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.freedesktop.secrets
  - --filesystem=home
  # - --filesystem=xdg-public-share
  # - --filesystem=xdg-pictures
  # - --filesystem=xdg-videos
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.gtk.vfs.*
  - --talk-name=org.gtk.MountOperationHandler
  - --own-name=org.gnome.gthumb

cleanup:
  - /bin/cd-*
  - /include
  - /lib/cmake
  - /lib/girepository-*
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/doc
  - /share/man
  - /share/vala
  - '*.a'
  - '*.la'

modules:

  - name: libraw
    buildsystem: autotools
    config-opts:
      - --disable-examples
    sources:
      - type: archive
        url: https://www.libraw.org/data/LibRaw-0.22.3.tar.gz
        sha256: 789f3c33466210a1a0907f747a97c715d21bbf4af712f257fcbbd90111b227e4
        x-checker-data:
          type: anitya
          project-id: 1709
          stable-only: true
          url-template: https://www.libraw.org/data/LibRaw-$version.tar.gz

  # Required by: colord
  - name: libgusb
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dvapi=false
      - -Dtests=false
    cleanup:
      - /bin/gusbcmd
    sources:
      - type: archive
        url: https://github.com/hughsie/libgusb/releases/download/0.4.9/libgusb-0.4.9.tar.xz
        sha256: 9df5ef301d6a4b361002aa52cce1165a87a89744055879bdbab31e7e86f1e846

  - name: colord
    buildsystem: meson
    config-opts:
      - -Dargyllcms_sensor=false
      - -Dbash_completion=false
      - -Ddocs=false
      - -Dman=false
      - -Dtests=false
      - -Dinstalled_tests=false
      - -Dudev_rules=false
      - -Dsystemd=false
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/colord/releases/colord-1.4.8.tar.xz
        sha256: 21500bd68975312a7f0f3ce6019d9f75f42aacaa75ca7115ec720b5445406896
        x-checker-data:
          type: anitya
          project-id: 10190
          stable-only: true
          url-template: https://www.freedesktop.org/software/colord/releases/colord-$version.tar.xz

  - name: libinih
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/benhoyt/inih.git
        tag: r58
        commit: 5cc5e2c24642513aaa5b19126aad42d0e4e0923e

  - name: exiv2
    buildsystem: cmake-ninja
    cleanup:
      - /lib/exiv2
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_SKIP_RPATH=ON
      - -DEXIV2_BUILD_SAMPLES=OFF
      - -DEXIV2_BUILD_UNIT_TESTS=OFF
      - -DEXIV2_ENABLE_VIDEO=ON
      - -DEXIV2_ENABLE_NLS=ON
      - -DEXIV2_ENABLE_XMP=ON
      - -DEXIV2_ENABLE_CURL=ON
      - -DEXIV2_ENABLE_WEBREADY=ON
      - -DEXIV2_ENABLE_BMFF=ON
    sources:
      - type: archive
        url: https://github.com/Exiv2/exiv2/archive/refs/tags/v0.28.9.tar.gz
        sha256: 700b76b97695b2fab4ef8c79619c68ae57d09e0c130724791cafbd39e0eb4aef
        x-checker-data:
          type: anitya
          project-id: 769
          stable-only: true
          url-template: https://github.com/Exiv2/exiv2/archive/refs/tags/v$version.tar.gz

  - name: gThumb
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
      - -Dflatpak-build=true
    # Fix non-png-icon-in-hicolor-size-folder error
    post-install:
      - mv /app/share/icons/hicolor/16x16/apps/org.gnome.gthumb-symbolic.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gthumb/4.0/gthumb-4.0.tar.xz
        sha256: a24aaa72b5637f49097dedc9c141a33615da770d029315f3285ebf2156cf7b61
        x-checker-data:
          type: gnome
          name: gthumb
          stable-only: true
